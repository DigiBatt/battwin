site_name: battwin
site_description: >-
  Battery Twin Envelope (BTE): an open specification and reference SDK for
  expressing and exchanging battery digital twins.
site_url: https://digibatt.github.io/battwin/
repo_url: https://github.com/DigiBatt/battwin
repo_name: DigiBatt/battwin
edit_uri: edit/main/docs/
copyright: >-
  Apache-2.0 &middot; Developed with support from the European Union
  (grant agreement 101103997, DigiBatt)

theme:
  name: material
  icon:
    logo: material/battery-charging-outline
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

nav:
  - Home: index.md
  - Guide:
      - Getting started: getting-started.md
      - The twin envelope: guide/envelope.md
      - Versioning and hashing: guide/versioning.md
      - Validation: guide/validation.md
      - Linked data: guide/linked-data.md
      - BattINFO integration: guide/battinfo.md
      - ECM models and simulation: guide/ecm-sim.md
      - CLI reference: guide/cli.md
  - Specification: spec.md
  - API reference: api.md
  - Project:
      - Changelog: changelog.md
      - Contributing: contributing.md
      - Development guide: development.md

hooks:
  - docs/_hooks.py

exclude_docs: |
  _hooks.py
  __pycache__/

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_root_heading: true
            show_source: true
            members_order: source
            filters: ["!^_"]
            merge_init_into_class: true
            show_signature_annotations: true
            separate_signature: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/DigiBatt/battwin
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/battwin/
