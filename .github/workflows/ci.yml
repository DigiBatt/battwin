name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,shacl]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy src

      - name: Test
        run: pytest -q

  # One representative interpreter with the sim and fit extras installed, so
  # the PyBaMM/PyBOP-dependent side of every skip in test_sim.py and
  # test_fit.py is exercised, and the combined [sim,fit] pins are proven to
  # resolve jointly.
  quality-sim-fit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (with sim and fit extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,shacl,sim,fit]"

      - name: Test
        run: pytest -q
