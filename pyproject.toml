[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "battwin"
version = "0.4.0"
description = "Battery Twin Envelope (BTE): an open specification and reference SDK for expressing and exchanging battery digital twins"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Simon Clark"},
]
keywords = ["battery", "digital-twin", "battery-passport", "linked-data", "bdf", "battinfo", "bpx", "battwin"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "pydantic>=2.0,<3",
  "jsonschema>=4.18,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "ruff",
  "mypy",
  "types-jsonschema",
]
shacl = ["pyshacl>=0.25"]
sim = ["pybamm>=25.6,<27"]
fit = ["pybop>=26.3,<27", "pybamm>=25.6,<27"]
docs = [
  "sphinx>=8",
  "myst-parser>=4",
  "pydata-sphinx-theme>=0.16",
  "sphinx-design>=0.6",
  "sphinx-copybutton>=0.5",
  "autodoc-pydantic>=2.2",
]

[project.scripts]
battwin = "battwin.cli:main"

[project.urls]
Homepage = "https://github.com/DigiBatt/battwin"
Documentation = "https://digibatt.github.io/battwin/"
Repository = "https://github.com/DigiBatt/battwin"
Issues = "https://github.com/DigiBatt/battwin/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
battwin = ["schemas/*.json", "context/*.jsonld", "shapes/*.ttl", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]

[[tool.mypy.overrides]]
# Optional runtime dependencies of the extras: not installed in the base dev
# environment, and untyped anyway.
module = ["numpy.*", "pybamm.*", "pybop.*", "pyshacl.*", "rdflib.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pinned to the ruleset this codebase was written against (the pre-0.16 ruff
# defaults) plus import sorting. Ruff's own defaults drift between versions;
# an unpinned selection turned the gate red without any code change.
select = ["E4", "E7", "E9", "F", "I"]
